<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Govind Rana portfolio showcasing projects, skills, and learning journey as a CSE student and aspiring full-stack developer." />
    <title>Govind Rana | Portfolio</title>
    <script>
      try {
        const theme = localStorage.getItem('portfolio-theme-v2');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.classList.toggle('light', theme === 'light');
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // Keep the default dark theme when storage is unavailable.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
